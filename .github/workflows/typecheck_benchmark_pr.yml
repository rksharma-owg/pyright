name: Fork benchmark preflight
run-name: 'Type checker benchmark for PR #${{ inputs.pr_number }}'

env:
  BENCHMARK_RUNNER_CLASS: 'github-ubuntu-latest'
  NODE_VERSION: '24.15.0'
  PYTHON_VERSION: '3.14.6'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Pull request head commit
        required: true
        type: string
      base_sha:
        description: Pull request base commit
        required: true
        type: string
      merge_sha:
        description: Pull request merge commit
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  packages:
    name: Resolve benchmark packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.packages.outputs.count }}
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_sha }}
          sparse-checkout: build/benchmark/install_envs.json
          persist-credentials: false

      - name: Build package matrix
        id: packages
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path("build/benchmark/install_envs.json").read_text(encoding="utf-8")
          )
          packages = [
              package.get("name") or package["github_url"].rsplit("/", 1)[-1]
              for package in config["packages"]
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(packages)}\n")
              output.write(f"matrix={json.dumps(packages, separators=(',', ':'))}\n")

  benchmark:
    name: Compare ${{ matrix.package }}
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.merge_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_sha }}
          path: benchmark-base
          persist-credentials: false

      - name: Verify contribution merge and baseline
        env:
          MERGE_SHA: ${{ inputs.merge_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C benchmark-base rev-parse HEAD)" = "$BASE_SHA"
          git rev-parse HEAD
          git -C benchmark-base rev-parse HEAD

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate benchmark pnpm store
        id: benchmark-pnpm
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "lock-hash=$(sha256sum benchmark-base/pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore trusted benchmark pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.benchmark-pnpm.outputs.path }}
          key: typecheck-benchmark-pnpm-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ steps.benchmark-pnpm.outputs.lock-hash }}

      - name: Verify build prerequisites
        run: |
          gcc --version
          g++ --version
          make --version

      - name: Install base JavaScript dependencies
        timeout-minutes: 10
        working-directory: benchmark-base
        env:
          SKIP_LERNA_BOOTSTRAP: 'yes'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build base Pyright CLI
        working-directory: benchmark-base/packages/pyright
        run: pnpm run build

      - name: Run base benchmark
        working-directory: benchmark-base
        env:
          NODE_OPTIONS: '--max-old-space-size=6656'
          PYTHONNOUSERSITE: '1'
        run: |
          python build/benchmark/typecheck_benchmark.py \
            -c pyright -r 3 -w 1 -t 1800 --memory-limit-mb 8192 \
            --package-names '${{ matrix.package }}' \
            --skip-pyright-build --os-name linux-x64 \
            --output ../build/benchmark/results/base

      - name: Install candidate JavaScript dependencies
        timeout-minutes: 10
        env:
          SKIP_LERNA_BOOTSTRAP: 'yes'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build candidate Pyright CLI
        working-directory: packages/pyright
        run: pnpm run build

      - name: Run candidate benchmark
        env:
          NODE_OPTIONS: '--max-old-space-size=6656'
          PYTHONNOUSERSITE: '1'
          PYRIGHT_BENCHMARK_ENTRY_POINT: ${{ github.workspace }}/packages/pyright/index.js
        run: |
          python benchmark-base/build/benchmark/typecheck_benchmark.py \
            -c pyright -r 3 -w 1 -t 1800 --memory-limit-mb 8192 \
            --package-names '${{ matrix.package }}' \
            --skip-pyright-build --os-name linux-x64 \
            --output build/benchmark/results/candidate

      - name: Upload package results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-benchmark-shard-pr-${{ inputs.pr_number }}-${{ matrix.package }}
          path: build/benchmark/results/
          if-no-files-found: error

  aggregate:
    name: Aggregate benchmark results
    needs: [packages, benchmark]
    if: ${{ always() && needs.benchmark.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download package results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: typecheck-benchmark-shard-pr-${{ inputs.pr_number }}-*
          path: benchmark-shards

      - name: Merge package results
        env:
          EXPECTED_PACKAGE_COUNT: ${{ needs.packages.outputs.count }}
        run: |
          mapfile -t base_results < <(find benchmark-shards -path '*/base/latest-linux-x64.json' -print | sort)
          mapfile -t candidate_results < <(find benchmark-shards -path '*/candidate/latest-linux-x64.json' -print | sort)
          if (( ${#base_results[@]} != EXPECTED_PACKAGE_COUNT )); then
            echo "Expected $EXPECTED_PACKAGE_COUNT base results, found ${#base_results[@]}" >&2
            exit 1
          fi
          if (( ${#candidate_results[@]} != EXPECTED_PACKAGE_COUNT )); then
            echo "Expected $EXPECTED_PACKAGE_COUNT candidate results, found ${#candidate_results[@]}" >&2
            exit 1
          fi
          mkdir -p build/benchmark/results/base build/benchmark/results/candidate
          python build/benchmark/merge_benchmark_results.py \
            "${base_results[@]}" \
            --output build/benchmark/results/base/latest-linux-x64.json
          python build/benchmark/merge_benchmark_results.py \
            "${candidate_results[@]}" \
            --output build/benchmark/results/candidate/latest-linux-x64.json

      - name: Compare base and candidate
        id: comparison
        continue-on-error: true
        run: |
          set +e
          python build/benchmark/compare_benchmarks.py \
            build/benchmark/results/base/latest-linux-x64.json \
            build/benchmark/results/candidate/latest-linux-x64.json \
            --statistic median \
            --fail-on-preparation-error \
            --markdown-output build/benchmark/results/report.md
          comparison_status=$?
          cat build/benchmark/results/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$comparison_status"

      - name: Upload combined benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-benchmark-linux-x64-pr-${{ inputs.pr_number }}-head-${{ inputs.head_sha }}-base-${{ inputs.base_sha }}-merge-${{ inputs.merge_sha }}
          path: build/benchmark/results/

      - name: Fail on benchmark regressions
        if: ${{ steps.comparison.outcome == 'failure' }}
        run: exit 1
