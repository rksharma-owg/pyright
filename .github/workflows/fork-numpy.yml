name: Fork NumPy compatibility

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact merge commit to validate
        required: true
        type: string
      baseline_sha:
        description: Current upstream target commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - name: Verify target and baseline SHAs
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          node -e "const cp=require('child_process');for(const sha of [process.env.TARGET_SHA,process.env.BASELINE_SHA]) {if(!/^[0-9a-f]{40}$/.test(sha)) process.exit(1);cp.execFileSync('git',['cat-file','-e',sha+'^{commit}']);} if(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.TARGET_SHA) process.exit(1)"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv .numpy-canary-venv
          .numpy-canary-venv/bin/python -m pip install numpy==2.4.6
      - name: Build current core and CLI
        run: |
          pnpm --dir packages/pyright-internal run build
          pnpm run build:cli:dev
      - name: Check work budget and semantic controls
        run: pnpm --dir packages/pyright-internal exec jest --testPathPatterns=protocolRequirementComplexity.test --runInBand --forceExit
      - name: Check NumPy canary
        run: node build/benchmark/numpyCanary.cjs --python "$PWD/.numpy-canary-venv/bin/python"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numpy-canary
          path: build/benchmark/results/numpy-canary/
          if-no-files-found: warn
